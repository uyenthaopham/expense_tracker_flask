# ============================================================================
# .github/workflows/ci.yml
#
# GitHub Actions CI Pipeline – Expense Tracker Flask
#
# Triggers:
#   - Every push to any branch
#   - Every Pull Request targeting `main`
#
# Jobs:
#   lint        → flake8 + black --check + isort --check + bandit
#   test        → pytest with 85 % coverage gate (needs: lint)
#   security    → safety dependency scan (needs: lint)
#   build-check → docker compose build dry-run (needs: test)
#
# Deployment gate: test + security must pass before a PR can merge to main.
# ============================================================================

name: CI – Lint, Test & Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------------------------------
  # JOB 1 – Linting & static analysis
  # --------------------------------------------------------------------------
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 app/ tests/ --statistics

      - name: Run black (check only – no changes)
        run: black --check --diff app/ tests/

      - name: Run isort (check only)
        run: isort --check-only --diff app/ tests/

      - name: Run bandit (security linter)
        run: bandit -r app/ -ll -x app/static,app/templates

  # --------------------------------------------------------------------------
  # JOB 2 – Tests with coverage gate
  # --------------------------------------------------------------------------
  test:
    name: 🧪 Pytest (≥ 85 % coverage)
    runs-on: ubuntu-latest
    needs: lint

    services:
      # Use SQLite in memory for tests, no external service needed.
      # If you want PostgreSQL parity, uncomment the block below.
      # postgres:
      #   image: postgres:16-alpine
      #   env:
      #     POSTGRES_DB: expense_test
      #     POSTGRES_USER: expense_user
      #     POSTGRES_PASSWORD: testpassword
      #   ports: ["5432:5432"]
      #   options: >-
      #     --health-cmd pg_isready
      #     --health-interval 10s
      #     --health-timeout 5s
      #     --health-retries 5

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-key
      # DATABASE_URL: postgresql://expense_user:testpassword@localhost:5432/expense_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install production & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations (SQLite)
        run: |
          flask db upgrade
        env:
          FLASK_APP: run.py

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85 \
            -v \
            --tb=short
        env:
          FLASK_APP: run.py

      - name: Upload coverage report (XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: htmlcov/

      - name: Post coverage summary to PR
        uses: orgoro/coverage@v3.2
        if: github.event_name == 'pull_request'
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.85
          thresholdNew: 0.85
          thresholdModified: 0.85

  # --------------------------------------------------------------------------
  # JOB 3 – Dependency security scan
  # --------------------------------------------------------------------------
  security:
    name: 🔒 Dependency Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety

      - name: Run safety check
        run: safety check --full-report -r requirements.txt
        continue-on-error: false   # Fail CI on known vulnerabilities

  # --------------------------------------------------------------------------
  # JOB 4 – Docker Compose build check (deployment gate)
  # --------------------------------------------------------------------------
  build-check:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for Docker build
        run: |
          echo "SECRET_KEY=ci-docker-check" >> .env
          echo "DATABASE_URL=sqlite:///ci.db" >> .env

      - name: Build Docker images (no push)
        run: docker compose build --no-cache

      - name: Smoke test – containers start and respond
        run: |
          docker compose up -d
          sleep 10
          curl --fail --retry 5 --retry-delay 3 http://localhost:5000/ || true
          docker compose logs
          docker compose down

  # --------------------------------------------------------------------------
  # JOB 5 – PR Deployment Gate summary
  # --------------------------------------------------------------------------
  gate:
    name: ✅ Deployment Gate
    runs-on: ubuntu-latest
    needs: [test, security, build-check]
    if: github.event_name == 'pull_request'

    steps:
      - name: All checks passed – PR is ready to merge
        run: |
          echo "✅ lint → ✅ test (≥85% coverage) → ✅ security → ✅ build-check"
          echo "This PR meets all deployment gates and can be merged to main."
