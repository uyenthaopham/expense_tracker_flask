[pytest]
# ---------------------------------------------------------------------------
# Expense Tracker – pytest configuration
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum coverage threshold (CI will fail below this)
# Run with: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-fail-under=85

markers =
    auth: Authentication tests
    expense: Expense CRUD tests
    category: Category tests
    integration: Full integration tests
    edge_case: Edge cases and boundary tests
    security: Security-related tests (SQL injection, XSS, access control)
