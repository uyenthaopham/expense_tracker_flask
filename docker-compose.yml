# ============================================================================
# docker-compose.yml – Expense Tracker Full Stack
#
# Services:
#   db      → PostgreSQL 16
#   app     → Flask / Gunicorn (depends on db)
#   nginx   → Reverse proxy + static file serving (depends on app)
#
# Quick start (< 5 min):
#   cp .env.example .env   # fill in secrets
#   docker compose up -d
#   docker compose exec app flask db upgrade
#   open http://localhost
# ============================================================================

version: "3.9"

services:

  # --------------------------------------------------------------------------
  # PostgreSQL database
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: expense_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-expense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense_user} -d ${POSTGRES_DB:-expense_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # --------------------------------------------------------------------------
  # Flask application (Gunicorn)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: expense_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-expense_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-expense_tracker}
    volumes:
      # Persist uploaded files if any
      - app_uploads:/app/uploads
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend
      - frontend

  # --------------------------------------------------------------------------
  # Nginx reverse proxy
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: expense_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      # Uncomment for HTTPS:
      # - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/static:ro
      # Uncomment for TLS certificates:
      # - ./docker/certs:/etc/nginx/certs:ro
    networks:
      - frontend

# --------------------------------------------------------------------------
# Named volumes & networks
# --------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
